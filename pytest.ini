[pytest]
# ──────────────────────────────────────────────
# CyberShield E2E Test Suite — pytest.ini
# ──────────────────────────────────────────────
testpaths = tests/e2e

# Verbose output with short summary for failed tests
addopts =
    -v
    --tb=short
    --color=yes
    -p no:warnings
    --headless

# Markers for categorising tests
markers =
    auth:         Authentication and session tests
    rbac:         Role-based access control tests
    analyst:      Analyst workflow tests
    forensics:    Forensics investigator tests
    admin:        System administrator tests
    security:     Security compliance tests
    smoke:        Quick smoke tests (subset for CI)

# Timeout per test (requires pytest-timeout: pip install pytest-timeout)
# timeout = 60

# Log settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
