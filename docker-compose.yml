version: '3.9'

services:

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: cybershield_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       cybershield_db
      POSTGRES_USER:     cybershield_user
      POSTGRES_PASSWORD: cybershield_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybershield_user -d cybershield_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Celery broker + Django Channels) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cybershield_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybershield_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             uvicorn cybershield_core.asgi:application --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DB_HOST:    db
      REDIS_HOST: redis
      REDIS_URL:  redis://redis:6379/0
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }

  # ── Celery Worker ──────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybershield_celery
    restart: unless-stopped
    command: celery -A cybershield_core worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      DB_HOST:    db
      REDIS_HOST: redis
      REDIS_URL:  redis://redis:6379/0
    depends_on:
      - db
      - redis

  # ── Celery Beat (Periodic Tasks) ───────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybershield_beat
    restart: unless-stopped
    command: celery -A cybershield_core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      DB_HOST:    db
      REDIS_HOST: redis
      REDIS_URL:  redis://redis:6379/0
    depends_on:
      - db
      - redis

  # ── React Frontend (Dev) ───────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: cybershield_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000

volumes:
  postgres_data:
  media_data:
